name: Tests and Coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      statuses: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes (tentativa 1)
        continue-on-error: true
        run: npm run test -- --coverage

      - name: Rodar testes (tentativa 2)
        if: failure()
        continue-on-error: true
        run: npm run test -- --coverage

      - name: Rodar testes (tentativa 3)
        if: failure()
        run: npm run test -- --coverage

      - name: Report status check
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha,
              state: "success",
              context: "Tests and Coverage",
              description: "CI passed after retries"
            })

